name: Mantenha as APIs vivas

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping snapline-api
        run: curl --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 https://snapline-api.onrender.com/api/test

      - name: Ping sos-malhada-api
        run: curl --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 https://sosmalhadaapi.onrender.com/test

      - name: Ping foamgo-api
        run: curl --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 https://foamgoapi.onrender.com/
